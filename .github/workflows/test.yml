# Runs the app's logic, end-to-end (Playwright) and data-migration tests on every push and pull request.
name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and the test browser
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Refresh the test user so dates are relative to today
        run: node scripts/fixture.mjs

      - name: Run tests
        run: npm test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/shots/
          retention-days: 7
