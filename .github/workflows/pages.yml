# Publishes the web version of Hillpace plus the privacy policy and support pages to GitHub Pages.
# App Store Connect needs public URLs for the privacy policy and support pages:
#   https://<user>.github.io/<repo>/privacy.html  and  https://<user>.github.io/<repo>/support.html
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          node scripts/build.mjs
          # www/ is a complete offline site: index.html (the app), privacy.html, support.html and bundled fonts
          touch www/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
